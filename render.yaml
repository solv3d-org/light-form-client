services:
  - type: web
    name: light-form-backend
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm ci --workspaces=false
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: light-form-backend-db
          property: connectionString
      - key: STAFF_CATALOG_SOURCE
        value: shopify
      - key: STAFF_JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: SHOPIFY_API_VERSION
        value: "2026-04"
      - key: CORS_ORIGIN
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_LOCATION_ID
        sync: false
      - key: WEBHOOK_PUBLIC_BASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Admin

databases:
  - name: light-form-backend-db
    region: singapore
    plan: free
    databaseName: light_form_backend
    user: light_form_backend
